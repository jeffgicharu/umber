<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>A short pause · Umber</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f2ede4;
        color: #16120e;
        font-family: Georgia, "Times New Roman", serif;
      }
      main { max-width: 560px; }
      .mark { font-size: 1.75rem; letter-spacing: -0.02em; }
      .label {
        margin-top: 48px;
        font: 600 0.75rem/1.3 Arial, Helvetica, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #4a4038;
      }
      h1 { margin: 12px 0 16px; font-size: clamp(2rem, 6vw, 3rem); font-weight: 400; line-height: 1.05; }
      p { font: 1.05rem/1.6 Arial, Helvetica, sans-serif; color: #4a4038; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Umber</div>
      <p class="label">A short pause</p>
      <h1>We will be back in a moment.</h1>
      <p>Please try again shortly. Your bids are safe: a bid is only ever shown as accepted once it has been recorded.</p>
    </main>
  </body>
</html>
